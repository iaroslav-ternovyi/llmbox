name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: bubblewrap (the code block runs a model's code only inside it)
        run: |
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: rsvg-convert and IBM Plex (the result card is drawn and checked as a PNG)
        run: |
          sudo apt-get install -y -q librsvg2-bin fonts-ibm-plex || { sudo add-apt-repository -y multiverse && sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin fonts-ibm-plex; }
      - name: tests that need no saved results (python3 tests/run_all.py --portable)
        env:
          LLMBOX_HOME: ${{ runner.temp }}/llmbox
          LLMBOX_NO_DB: "1"
        run: python3 tests/run_all.py --portable
