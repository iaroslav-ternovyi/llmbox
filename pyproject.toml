[project]
name = "llmbox"
version = "0.1.0"
description = "Get the most quality x speed out of local LLMs on your hardware: scout, tune, benchmark, compare."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llmbox = "llmbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmbox"]
